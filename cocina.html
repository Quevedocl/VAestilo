<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>VAestilo · Cocina</title><link rel="icon" href="imagenes/favicon.svg"><script src="js/compartido/config.js"></script>
<link rel="stylesheet" href="css/cocina/colores.css">
<link rel="stylesheet" href="css/cocina/base.css">
<link rel="stylesheet" href="css/cocina/cabecera-y-avisos.css">
<link rel="stylesheet" href="css/cocina/barra-filtros-y-lista.css">
<link rel="stylesheet" href="css/cocina/tarjetas-pedido-estados.css">
<link rel="stylesheet" href="css/cocina/animaciones.css">
<link rel="stylesheet" href="css/cocina/tarjetas-pedido.css">
<link rel="stylesheet" href="css/cocina/pantalla-de-inicio.css">
<link rel="stylesheet" href="css/cocina/adaptacion-movil.css">
</head><body>
<div id="gate"><h1 id="gh">Cocina</h1><p id="gname">Verificando enlace…</p><p id="gmsg"></p><button id="go" hidden>Iniciar turno</button></div>
<header><b id="rn">VAestilo</b><span class="est" id="est">Cocina</span><span class="sp"></span><span class="pill" id="pw">Pantalla</span><span class="pill" id="ps">Sonido</span></header>
<div id="warn" hidden>Sin conexión con el servidor · reintentando… Si dura, avisa al encargado.</div>
<div class="tbr">
  <div class="seg" id="seg"><button data-f="" class="on">Todos <b>0</b></button><button data-f="pending">Nuevos <b>0</b></button><button data-f="preparing">En preparación <b>0</b></button><button data-f="ready">Listos <b>0</b></button></div>
  <select id="mesa" aria-label="Filtrar por mesa"></select>
  <div class="lg"><span><i style="background:var(--ok)"></i>menos de 10 min</span><span><i style="background:var(--warn)"></i>10–19 min</span><span><i style="background:var(--bad)"></i>20 min o más</span></div>
</div>
<div class="sum" id="sum" hidden title="Toca para ver todo"></div>
<main class="grid" id="grid"></main>
<script src="js/cocina/estacion-y-llave.js"></script>
<script src="js/cocina/servidor-y-estado.js"></script>
<script src="js/cocina/sonido-y-pantalla-activa.js"></script>
<script src="js/cocina/tiempos.js"></script>
<script src="js/cocina/dibujar-pedidos.js"></script>
<script src="js/cocina/actualizar-pedidos.js"></script>
<script src="js/cocina/eventos.js"></script>
<script src="js/cocina/inicio.js"></script>
</body></html>
